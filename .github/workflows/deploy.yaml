name: deploy/test

on:
  push:
    branches:
      - main
  workflow_call:

permissions: {}

jobs:
  test-ct-category:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: labd/gh-actions-typescript/pnpm-install@ada4548df9a365c62c8b396b583953c6d4bc113f # v1.1.0
        with:
          node-version: "24"
          cache: "false"

      - name: Test
        working-directory: packages/ct-category
        run: pnpm test

  deploy-ct-category:
    needs: test-ct-category
    name: Deploy CT category field plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: labd/gh-actions-typescript/pnpm-install@ada4548df9a365c62c8b396b583953c6d4bc113f # v1.1.0
        with:
          node-version: "24"
          cache: "false"

      - name: Build
        working-directory: packages/ct-category
        run: pnpm build

      - name: Deploy
        working-directory: packages/ct-category
        env:
          STORYBLOK_PERSONAL_ACCESS_TOKEN: ${{ secrets.STORYBLOK_PERSONAL_ACCESS_TOKEN }}
        run: pnpm exec field-plugin deploy --scope partner-portal --name ct-category --skipPrompts
