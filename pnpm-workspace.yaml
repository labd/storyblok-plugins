packages:
  - 'packages/*'

minimumReleaseAge: 20160 # 14 days
# Locked versions younger than 14 days when moving to pnpm 12; drop once they are older (after 2026-11-06).
minimumReleaseAgeExclude:
  - "baseline-browser-mapping@2.11.31"
  - "browserslist@4.29.4"
  - "caniuse-lite@1.0.30001819"
  - "electron-to-chromium@1.5.463"
  - "node-releases@2.0.60"
  - "postcss-selector-parser@7.1.7"
  - "postcss@8.5.31"
  - "qs@6.16.1"
  - "vite@6.4.5"

overrides:
  postcss-selector-parser@<7.1.6: ^7.1.6
  valibot@<1.4.2: ^1.4.2

allowBuilds:
  esbuild: false # postinstall only verifies the platform binary; was already skipped under pnpm 10
