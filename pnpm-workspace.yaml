packages:
  - 'packages/*'

minimumReleaseAge: 20160 # 14 days
# Locked versions younger than 14 days when moving to pnpm 12; drop once they are older (after 2026-11-06).
minimumReleaseAgeExclude:
  - "postcss@8.5.31"
  - "qs@6.16.1"
  # GHSA-p458-7748-mcp3 (@vitest/ui <5.0.5) is fixed in vitest 5.0.5, released 2026-10-15; drop after 2026-10-29.
  - "vitest@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/ui@5.0.5"
  - "@vitest/utils@5.0.5"
  # GHSA-mrhx-c7xc-m3w5 (zod <4.6.6) is fixed in zod 4.6.6, released 2026-10-11; drop after 2026-10-26.
  - "zod@4.6.6"
  # GHSA advisories for undici <8.12.2 (via jsdom) are fixed in undici 8.12.2, released 2026-10-15; drop after 2026-10-29.
  - "undici@8.12.2"

overrides:
  # vite is only referenced by the CLI's scaffolding templates, not at runtime; drop the outdated, vulnerable vite 5.
  "@storyblok/field-plugin-cli>vite": "-"
  valibot@<1.4.2: ^1.4.2
  zod@<4.6.6: ^4.6.6
  undici@>=8.0.0 <8.12.2: 8.12.2
